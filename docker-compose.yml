services:
  coti-mainnet-full-node-genesis:
    image: coti/mainnet-full-node:1.2.0
    container_name: coti-mainnet-full-node-genesis
    command: --datadir=/execution init /coti-genesis/genesis.json
    volumes:
      - ./execution/:/execution
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  coti-mainnet-full-node:
    image: coti/mainnet-full-node:1.2.0
    container_name: coti-mainnet-full-node
    command:
      - --soda.engine
      - --soda.seqaddr=0xB557a07a397B5c9C94FC44260dE6C8A45EF5e731
      - --soda.exec1addr=0x86d624fF6534506678FbBa569468CEf4e2d87749
      - --soda.exec2addr=0x1f5Fdff75e1CfEae39a6aaBb62CE78BfAA0B239d
      - --soda.validator      
      - --networkid=2632500
      - --http
      - --http.api=eth,net,web3,txpool
      - --http.corsdomain=*
      - --http.vhosts=*
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --port=7400
      - --identity=${FULLNODE_DNS_ADDRESS}
      - --verbosity=3
      - --datadir=/execution
      - --syncmode=full
      - --ws
      - --ws.port=8546
      - --ws.addr=0.0.0.0
      - --ws.origins=*
      - --ws.api=web3,eth
      - --metrics
      - --metrics.expensive
      - --metrics.addr=0.0.0.0
      - --rpc.allow-unprotected-txs=true
      - --miner.gasprice=5000000
      - --bootnodes=enode://d6d9087c70eba1fd80a77dcda8a2441876e1a94fa83a3650eebeafc14df59d7e0a43cebf5f03705c119f6a91d78bceeab897fde757d8e5178eda987fb35f6d31@40.160.230.79:7400,enode://9b6c699af8c180e03028fb661cb4cc149e1e58b467ae4b23c0301fe010c429ee47c67919bf5fdfdf8a8386002001d272b001581cb2bf297237ab95f9d7586a40@63.182.134.0:7400,enode://470b736ad52e7ea03b352dbcea61e51254808eb5b0f57a0f65849c13117fa6ec38b09fa8ee1b2bdc2973249fe263c2ef3f408adc0f66ac68b62ea119caad02d5@15.204.207.122:7400,enode://48a67162679e35b025bf189538ef5402bf4fe03b224dfaf64ae7036da26ebec8061ca3455ae20a0f57a8e4672c18640e6fc0f8d08eb0b593bd6ee4db831bc540@54.168.47.115:7400
      - --nat=extip:${FULLNODE_EXT_IP}
    ports:
      - 8545:8545
      - 8546:8546
      - 7400:7400
      - 7400:7400/udp
    depends_on:
      coti-mainnet-full-node-genesis:
        condition: service_completed_successfully
    volumes:
      - ./execution/:/execution/
      - ./execution/keystore:/execution/keystore
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
