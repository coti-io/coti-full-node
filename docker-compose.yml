services:
  mainnet-fullnode-genesis:
    image: coti/mainnet-full-node:1.1.3
    container_name: mainnet-fullnode-genesis
    command: --datadir=/execution init /coti-genesis/genesis.json
    volumes:
      - ./execution/:/execution
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  mainnet-fullnode:
    image: coti/mainnet-full-node:1.1.3
    container_name: mainnet-fullnode
    command:
      - --soda.engine
      - --soda.seqaddr=0xB557a07a397B5c9C94FC44260dE6C8A45EF5e731
      - --soda.exec1addr=0x86d624fF6534506678FbBa569468CEf4e2d87749
      - --soda.exec2addr=0x1f5Fdff75e1CfEae39a6aaBb62CE78BfAA0B239d
      - --soda.validator      
      - --networkid=2632500
      - --http
      - --http.api=eth,net,web3,txpool
      - --http.corsdomain=*
      - --http.vhosts=*
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --port=7400
      - --identity=${FULLNODE_DNS_ADDRESS}
      - --verbosity=3
      - --datadir=/execution
      - --syncmode=full
      - --ws
      - --ws.port=8546
      - --ws.addr=mainnet-fullnode
      - --ws.origins=*
      - --ws.api=web3,eth
      - --metrics
      - --metrics.expensive
      - --metrics.addr=mainnet-fullnode
      - --rpc.allow-unprotected-txs=true
      - --miner.gasprice=5000000
      - --bootnodes=enode://d6d9087c70eba1fd80a77dcda8a2441876e1a94fa83a3650eebeafc14df59d7e0a43cebf5f03705c119f6a91d78bceeab897fde757d8e5178eda987fb35f6d31@40.160.230.79:7400
      - --nat=extip:${FULLNODE_EXT_IP}
    ports:
      - 8545:8545
      - 8546:8546
      - 7400:7400
    depends_on:
      mainnet-fullnode-genesis:
        condition: service_completed_successfully
    volumes:
      - ./execution/:/execution/
      - ./execution/keystore:/execution/keystore
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
